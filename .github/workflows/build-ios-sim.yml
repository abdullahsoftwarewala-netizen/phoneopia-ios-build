name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios-sim:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS Simulator (release)
        run: flutter build ios --simulator --release --no-tree-shake-icons

      - name: Strip debug symbols
        run: |
          cd build/ios/iphonesimulator/Runner.app
          find . -name "*.dylib" -exec strip -x {} \; 2>/dev/null || true
          find . -name "Runner" -exec strip -x {} \; 2>/dev/null || true
          rm -f Runner.debug.dylib
          rm -f __preview.dylib

      - name: Package as zip
        run: |
          cd build/ios/iphonesimulator
          zip -r -9 ../../../phoneopia-ios-sim.zip Runner.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoneopia-ios-simulator
          path: phoneopia-ios-sim.zip
