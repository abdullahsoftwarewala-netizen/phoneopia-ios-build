name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios-sim:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS Simulator
        run: flutter build ios --simulator --debug --no-tree-shake-icons

      - name: Strip heavy frameworks
        run: |
          cd build/ios/iphonesimulator/Runner.app
          rm -f Runner.debug.dylib __preview.dylib 2>/dev/null || true
          rm -rf PlugIns 2>/dev/null || true
          rm -rf _CodeSignature 2>/dev/null || true
          strip -x Runner 2>/dev/null || true
          find . -name "*.dylib" -exec strip -x {} \; 2>/dev/null || true
          # Remove huge framework debug symbols and unused slices
          find . -name "*.framework/Versions/A/Headers" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.framework/Headers" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.framework/Modules" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.framework/*.png" -exec rm -f {} + 2>/dev/null || true
          find . -name "*.framework/Info.plist" -exec rm -f {} + 2>/dev/null || true
          # Remove arm64 slice (keep x86_64 for Appetize Intel sims)
          find . -name "*.framework/Versions/A/ios-arm64" -exec rm -rf {} + 2>/dev/null || true
          find . -name "ios-arm64" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Package zip
        run: |
          cd build/ios/iphonesimulator
          zip -r -9 ../../../phoneopia-ios-sim.zip Runner.app

      - name: Check size
        run: |
          SIZE=$(stat -f%z phoneopia-ios-sim.zip)
          echo "ZIP size: $SIZE bytes ($((SIZE/1024/1024)) MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoneopia-ios-simulator-stripped
          path: phoneopia-ios-sim.zip

      - name: Create release with asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-stripped
          name: Phoneopia iOS Sim (Stripped)
          files: phoneopia-ios-sim.zip
