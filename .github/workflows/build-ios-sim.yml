name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios-sim:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS Simulator (profile mode)
        run: flutter build ios --simulator --profile --no-tree-shake-icons

      - name: Strip and shrink
        run: |
          cd build/ios/iphonesimulator/Runner.app
          rm -f Runner.debug.dylib __preview.dylib 2>/dev/null || true
          strip -x Runner 2>/dev/null || true

      - name: Package zip
        run: |
          cd build/ios/iphonesimulator
          zip -r -9 ../../../phoneopia-ios-sim.zip Runner.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoneopia-ios-simulator
          path: phoneopia-ios-sim.zip
