name: phoneopia_mobile
description: Phoneopia - Modern Messaging App
publish_to: 'none'
version: 1.0.143+144

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  http_parser: ^4.0.2
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  image_cropper: ^8.0.2
  file_picker: ^8.1.2
  provider: ^6.1.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  path_provider: ^2.1.3
  crypto: ^3.0.3
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  package_info_plus: ^8.1.1
  open_filex: ^4.5.0
  record: ^5.2.0
  video_player: ^2.9.2
  flutter_local_notifications: ^18.0.1
  flutter_webrtc: ^0.14.0
  flutter_background_service: ^5.0.10
  flutter_svg: ^2.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_contacts: ^1.1.9+2
  nearby_connections:
    path: packages/nearby_connections
  connectivity_plus: ^6.1.0
  wakelock_plus: ^1.2.1

dependency_overrides:
  record_linux: 0.7.2
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: ic_launcher
  ios: true
  # Use the same high-resolution red Phoneopia icon shown by the installed
  # desktop/PWA app so Android and web branding stay identical.
  image_path: ../logo.png
  adaptive_icon_background: "#E81235"
  adaptive_icon_foreground: ../logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
